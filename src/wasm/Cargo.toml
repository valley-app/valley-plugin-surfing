# Surfing's ad-block kernel: `valley-plugin build` runs `cargo build --release --locked --target
# wasm32-unknown-unknown` here, optimizes it with the pinned wasm-opt and writes runtime/assets/filters.wasm.
[package]
name = "filters"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
valley-plugin-abi = { path = "abi" }
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "single-thread"] }
base64 = "0.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
incremental = false

# A standalone crate: no parent workspace is looked up.
[workspace]
